version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - |
          if [ "${AWS_BRANCH}" = "test" ]; then
            npm run build -- --configuration test
          else
            npm run build -- --configuration production
          fi

  artifacts:
    baseDirectory: dist/HomeDiary-app/browser
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
